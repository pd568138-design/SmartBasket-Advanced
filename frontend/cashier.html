<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cashier | Smart Basket</title><link rel="stylesheet" href="css/style.css">
<style>table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:9px 8px;border-bottom:1px solid #e3e8e1;text-align:left;vertical-align:top}.paid{color:#166534;font-weight:800}.pend{color:#b45309;font-weight:800}.items{margin:6px 0 0;padding-left:18px;color:#4b5f55}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:180px}.row .btn{width:auto}</style></head>
<body class="appbg"><header class="top"><a class="brand" href="main.html"><span class="mini">🧾</span> Cashier <small>Smart Basket orders</small></a><a class="btn secondary compact" href="main.html">Dashboard</a></header>
<main class="dash"><p class="eyebrow">CASHIER PANEL</p><h1>Customer <span>bills</span></h1>
<section class="glass panel"><label>Cashier key (CASHIER_KEY from Render)<div class="row"><input id="key" type="password" placeholder="enter key"><button id="load" class="btn primary compact">Load orders</button><button id="reset" class="btn secondary compact">Reset all baskets</button></div></label><p id="msg" class="tiny muted"></p></section>
<section class="glass panel" style="overflow-x:auto"><table><thead><tr><th>Order / Basket</th><th>Customer</th><th>Date &amp; time</th><th>Location</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="muted">Enter the key and press Load orders.</td></tr></tbody></table></section></main>
<script src="js/config.js"></script><script src="js/cashier.js"></script></body></html>
